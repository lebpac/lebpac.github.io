# Extracurricular programs, in the order they appear on the page.
# Each day has a `group` ("Lunch" or "After school") that drives the page headings (omit Lunch when none are running).
# Categories: active, arts, music, stem

categories:
  - key: active
    label: Active
    emoji: 🏃
  - key: arts
    label: Arts
    emoji: 🎨
  - key: music
    label: Music
    emoji: 🎶
  - key: stem
    label: Brains
    emoji: 🧠

days:
  - name: Mondays
    group: After school
    programs:
      - id: story-makers
        flyer: /assets/img/programs/winter-2027/storymakers.webp
        title: "Ready, Set, Goals: Story Makers"
        short: Story Makers
        emoji: ✍️
        category: arts
        blurb: Kids create their own characters and stories, storyboard their ideas, and build 3D models to bring them to life, all while learning to break a big goal into small steps.
        audience: Grades K – 4
        dates: Jan 11 – Mar 8
        no_sessions: No session Feb 15
        time: 3:00 – 4:30 pm
        cost: 300 + tax
        url: https://docs.google.com/forms/d/e/1FAIpQLSfrbhtly5dchDVLcrGQnw54LHWMsxQycW9p_3RQHQ296CKgEQ/viewform

  - name: Tuesdays
    group: After school
    programs:
      - id: lights-up-musical-theatre
        title: "Lights Up Musical Theatre: School of Camp Rock!"
        short: Musical Theatre
        emoji: 🎭
        category: arts
        blurb: Students sing, dance, and act their way through this winter's School of Camp Rock! while building stage skills, creativity, and confidence.
        audience: Grades K – 7
        dates: Jan 12 – Mar 9
        time: 3:00 – 5:15 pm
        cost: 380 + tax
        url: https://lightsuptheatre.ca/lecolebilingue/

  - name: Wednesdays
    group: After school
    programs:
      - id: brainiacs-board-games
        title: Brainiacs Board Games
        short: Board Games
        emoji: ♟️
        category: stem
        blurb: Strategy, logic, and good sportsmanship through classic and modern board games. Perfect for curious minds who love a challenge.
        audience: Grades K – 7
        dates: Jan 13 – Mar 3
        time: 3:00 – 5:00 pm
        cost: "272"
        url: https://www.brainiacsadventures.com/event-details-registration/leb-after-school-winter-2027-wednesdays

  - name: Thursdays
    group: After school
    programs:
      - id: wize-code-create-lab
        flyer: /assets/img/programs/winter-2027/wize.webp
        title: "WIZE Code & Create Lab: Scratch Animation & 3D Doodling"
        short: Coding & 3D Pens
        emoji: 💻
        category: stem
        blurb: Kids explore coding and STEM by creating animations and games in ScratchJr, then step away from the screen to design and build with 3D pens. No experience needed.
        audience: Grades K – 3
        note: A one-time $25 WIZE annual membership fee applies.
        dates: Jan 14 – Mar 4
        time: 3:00 – 4:30 pm
        cost: 300 + tax
        url: https://app.amilia.com/store/en/wize-academy-of-vancouver-south-richmond/shop/activities/7537103

      - id: youth-athletics
        title: Youth Athletics (Outdoor Program)
        short: Youth Athletics
        emoji: 🏃
        category: active
        blurb: An outdoor athletics program building speed, agility, and power through sprint mechanics, plyometrics, and games.

  - name: Fridays
    group: After school
    programs:
      - id: vems-group-guitar
        flyer: /assets/img/programs/fall-2026/vemsguitar.webp
        title: VEMS Group Guitar
        short: Group Guitar
        emoji: 🎸
        category: music
        blurb: Learn guitar in a small group, from first chords to favourite songs, and enjoy the fun of playing together.
        audience: Grades 4 – 7
        dates: Oct 2 – Jun 11
        time: 3:00 – 4:00 pm
        cost: 483 (full year)
        url: https://vems.ca/signup
